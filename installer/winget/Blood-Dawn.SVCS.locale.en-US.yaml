ShortDescription: Surveillance Video Compression System - motion-aware video compression with a local dashboard.
Description: >-
  SVCS (Surveillance Video Compression System) compresses surveillance and
  body-camera footage by spending bits where motion is and saving the rest at a
  lower rate. It runs a local web dashboard for compressing files or live feeds,
  an auto-compress watch-folder that compresses clips as they are saved, a
  library/gallery, and optional AES-256 encryption. FFmpeg, the ONNX runtime,
  and the detection model are bundled, so the installed app works with no extra
  dependencies.
