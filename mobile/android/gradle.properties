# SVCS Mobile - Gradle properties.
#
# Author: Bloodawn (KheivenD), 2026-07-19 (M1.1 first-compile fixes).

# Required. Without it the build fails at :app:checkDebugAarMetadata, because
# every Compose and Lifecycle artifact is an AndroidX dependency and AGP
# refuses to mix them with the legacy support library namespace.
android.useAndroidX=true

# Each module gets only its OWN resource IDs in R, not its dependencies'.
# Keeps the generated R class small and makes an accidental reliance on a
# transitive resource a compile error rather than a silent coupling.
android.nonTransitiveRClass=true

# The Kotlin daemon needs headroom for Compose compilation; the 512m default
# produces intermittent OOMs on a multi-module Compose build.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build only the ABIs a real phone uses. Skips x86/x86_64 emulator slices,
# which this project does not target: the test device is a physical phone
# (see docs/MOBILE-ARCHITECTURE.md M1.1).
android.defaultConfig.ndk.abiFilters=arm64-v8a,armeabi-v7a

org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
