[project]
name = "capstone-compression"
version = "0.1.0"
description = "Open-source selective video compression for static surveillance cameras"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Kheiven D'Haiti", email = "kdhaiti2024@fau.edu" },
    { name = "Jorge Sanchez", email = "jorgesanchez2022@fau.edu" },
    { name = "Ashleyn Montano", email = "amontano2023@fau.edu" },
    { name = "Riley Roberts", email = "robertsr2022@fau.edu" },
    { name = "Victor De Souza Teixeira", email = "vdesouzateix2023@fau.edu" },
]

dependencies = [
    # Core vision and video
    "opencv-python>=4.8.0,<4.11.0",
    "numpy>=1.24.0,<2.0.0",
    "Pillow>=10.0.0",
    # Video processing
    "ffmpeg-python>=0.2.0",
    # Pipeline utilities
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "Flask>=3.0.0",
    # Metrics and evaluation
    "scikit-image>=0.21.0",
    "scipy>=1.11.0",
    # Notebooks
    "jupyter>=1.0.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    # Testing
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[project.optional-dependencies]
# Super-resolution enhancement — only needed if using --enhance flag
# Install with: uv sync --extra enhance
enhance = [
    "basicsr>=1.4.2",
    "realesrgan>=0.3.0",
]

[project.scripts]
run-gui = "src.gui.run_gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: real subprocess / network tests (may be slow)",
]
