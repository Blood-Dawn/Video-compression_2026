[project]
name = "Video-compression"
version = "0.1.0"
description = "Open-source selective video compression for static surveillance cameras"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Kheiven D'Haiti", email = "kdhaiti2024@fau.edu" },
    { name = "Jorge Sanchez", email = "jorgesanchez2022@fau.edu" },
    { name = "Ashleyn Montano", email = "amontano2023@fau.edu" },
    { name = "Riley Roberts", email = "robertsr2022@fau.edu" },
    { name = "Victor De Souza Teixeira", email = "vdesouzateix2023@fau.edu" },
]

dependencies = [
    # Core vision and video
    "opencv-python>=4.8.0,<4.11.0",
    "numpy>=1.24.0,<2.0.0",
    "Pillow>=10.0.0",
    # Video processing
    "ffmpeg-python>=0.2.0",
    # Pipeline utilities
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "Flask>=3.0.0",
    # Metrics and evaluation
    "scikit-image>=0.21.0",
    "scipy>=1.11.0",
    # Notebooks
    "jupyter>=1.0.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    # System metrics (CPU, RAM, battery monitoring)
    "psutil>=5.9.0",
    # Testing
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    # YOLO smart detection filter.
    # YOLOv8-nano classifies MOG2 bounding boxes so leaves/shadows are not
    # recorded. Falls back to pass-through if this package is missing at
    # runtime. On first use, downloads yolov8n.pt (~6 MB) automatically.
    # License: AGPL-3.0. That's compatible with our open-source edition
    # because we also ship the regular app under AGPL-3.0 (see LICENSE).
    # Commercial-tier customers who can't comply with AGPL pay us through
    # LICENSE-COMMERCIAL.md; that deal covers either an Ultralytics
    # enterprise license sublicensed to them, or a swap to a permissive
    # detector (MediaPipe / RT-DETR) which is on the v2 roadmap anyway.
    "ultralytics>=8.0.0",
    # PyTorch core for Real-ESRGAN enhancement (BSD-3) and YOLO above.
    # Pinned to the CUDA 12.8 build via [tool.uv.sources] below; the CPU
    # build is served by PyPI by default which breaks our enhancer GPU path.
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    # AES-256-GCM segment encryption (the ENCRYPT tab in the dashboard).
    # Was previously imported lazily in src/utils/encryption.py without
    # being declared here, so a fresh `uv sync` left users without it
    # and the dashboard would fail with:
    #     "[!] Encryption failed: The 'cryptography' package is required"
    # Pinning >=41 because PBKDF2HMAC-from-bytes lives in the modern API.
    # Author: Bloodawn (KheivenD), 2026-05-03 (encrypt fix).
    "cryptography>=41.0.0",
    # Platform-aware app data / config / cache directories. Lets the
    # installed app write its small state files (.flask_secret, the
    # CPU benchmark cache, the persisted output_dir, etc.) to the
    # standard OS location instead of next to the binary, which is
    # required for any real installer to work on Windows or macOS.
    # On dev machines we still migrate any existing files from the
    # repo root automatically on first run so nothing is lost.
    # Author: Bloodawn (KheivenD), 2026-05-14 (installer prep).
    "platformdirs>=4.0.0",
]

[project.optional-dependencies]
# Super-resolution enhancement — only needed if using --enhance flag.
# Install with: uv sync --extra enhance
enhance = [
    "basicsr>=1.4.2",
    "realesrgan>=0.3.0",
]

# AI license-plate reader (post-process). PREMIUM-ONLY FEATURE — not
# included in the default consumer installer. The premium build script
# adds this extra so paying customers get the feature; the casual
# (open-source) installer omits it and the GUI auto-hides the plate
# reader button when no OCR backend is installed.
#
# EasyOCR is Apache-2.0 and is the primary backend. PaddleOCR has been
# removed from the default install set because the paddlepaddle wheel is
# large (~500 MB) and fragile on non-AVX CPUs. PaddleOCR is still
# supported at runtime if a customer installs it manually (the backend
# auto-detects). OpenALPR is intentionally NOT used (AGPL-3.0).
#
# Install (premium tier only):  uv sync --extra plates
# Author: Bloodawn (KheivenD), 2026-05-14 (premium branch split).
plates = [
    "easyocr>=1.7.0",
]

[project.scripts]
run-gui = "src.gui.run_gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# ── PyTorch CUDA index ────────────────────────────────────────────────────────
# Tell uv to always fetch torch and torchvision from the CUDA 12.8 wheel index
# instead of PyPI. Without this, uv/pip installs the CPU-only build because
# that is what PyPI serves by default.
#
# To upgrade CUDA version: change both the index URL and the index name here,
# then run: uv pip install torch torchvision --reinstall
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
