[project]
name = "Video-compression"
# v2 development line. v1.0.0 is tagged on `main` (sponsor handoff). The
# productization work on `app` is v2-in-progress.
version = "2.1.0.dev0"
description = "Open-source selective video compression for static surveillance cameras"
readme = "README.md"
# 3.11+ matches CONTRIBUTING.md and the codebase, which already uses
# 3.10+ syntax (e.g. `str | None` unions). Was wrongly pinned to >=3.9.
requires-python = ">=3.11"
authors = [
    { name = "Kheiven D'Haiti", email = "kdhaiti2024@fau.edu" },
    { name = "Jorge Sanchez", email = "jorgesanchez2022@fau.edu" },
    { name = "Ashleyn Montano", email = "amontano2023@fau.edu" },
    { name = "Riley Roberts", email = "robertsr2022@fau.edu" },
    { name = "Victor De Souza Teixeira", email = "vdesouzateix2023@fau.edu" },
]

dependencies = [
    # Core vision and video.
    # MUST be the -contrib build: src/background_subtraction uses
    # cv2.bgsegm.createBackgroundSubtractorGMG (an opencv-contrib-only
    # module) for the GMG method. Plain opencv-python lacks cv2.bgsegm, so
    # a fresh `uv sync` would import-error / skip GMG. Using contrib here
    # means a clean clone gets a working cv2 with MOG2 *and* GMG without a
    # manual reinstall. NOTE: this is mutually exclusive with the
    # opencv-python-headless that easyocr ([plates]) pulls — they share the
    # cv2/ namespace and clobber each other. Plate-reader is therefore
    # installed/tested in a SEPARATE environment, never alongside core
    # (see the [plates] note below and docs/test-baseline.md).
    # Author: Bloodawn (KheivenD), 2026-05-31 (M0 TASK 0.4b — opencv dep fix).
    "opencv-contrib-python>=4.8.0,<4.11.0",
    "numpy>=1.24.0,<2.0.0",
    "Pillow>=10.0.0",
    # Video processing
    "ffmpeg-python>=0.2.0",
    # Pipeline utilities
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "Flask>=3.0.0",
    # Metrics and evaluation
    "scikit-image>=0.21.0",
    "scipy>=1.11.0",
    # Notebooks
    "jupyter>=1.0.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    # System metrics (CPU, RAM, battery monitoring)
    "psutil>=5.9.0",
    # Testing
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    # NOTE (M2 TASK 2.2): ultralytics / torch / torchvision moved OUT of the
    # core dependencies into the optional [torch] extra below. The default
    # (slim) install runs object detection on ONNX Runtime (onnxruntime, core)
    # and has no PyTorch — which is what drops the installer from multi-GB to a
    # few hundred MB (PLAN-V2 §6). torch is still pulled when you install
    # [torch] (parity/export/the torch detector) or [enhance] (Real-ESRGAN,
    # which depends on torch). Author: Bloodawn (KheivenD), 2026-06-03.
    # AES-256-GCM segment encryption (the ENCRYPT tab in the dashboard).
    # Was previously imported lazily in src/utils/encryption.py without
    # being declared here, so a fresh `uv sync` left users without it
    # and the dashboard would fail with:
    #     "[!] Encryption failed: The 'cryptography' package is required"
    # Pinning >=41 because PBKDF2HMAC-from-bytes lives in the modern API.
    # SEC-008 (2026-06-21): floor raised to 48.0.1 (the fix for
    # GHSA-537c-gmf6-5ccf flagged by pip-audit); the lock pins 49.0.0.
    # Author: Bloodawn (KheivenD), 2026-05-03 (encrypt fix).
    "cryptography>=48.0.1",
    # Platform-aware app data / config / cache directories. Lets the
    # installed app write its small state files (.flask_secret, the
    # CPU benchmark cache, the persisted output_dir, etc.) to the
    # standard OS location instead of next to the binary, which is
    # required for any real installer to work on Windows or macOS.
    # On dev machines we still migrate any existing files from the
    # repo root automatically on first run so nothing is lost.
    # Author: Bloodawn (KheivenD), 2026-05-14 (installer prep).
    "platformdirs>=4.0.0",
    # ONNX Runtime — cross-platform inference engine for the slim install
    # path (PLAN-V2 §6, M2). The detector (and, where it exports cleanly, the
    # enhancer) can run on ONNX Runtime instead of PyTorch, which is what lets
    # the installer drop from multi-GB to a few hundred MB once torch becomes
    # optional (TASK 2.2). Pure-CPU wheel by default; tiny (~15 MB) next to
    # torch. The exported .onnx weights ship as an optional component, not a
    # committed binary. Author: Bloodawn (KheivenD), 2026-06-02 (TASK 2.1).
    "onnxruntime>=1.16.0",
]

[project.optional-dependencies]
# One-time ONNX export tooling (dev/build only — NOT needed at runtime).
# `yolo export model=yolov8n.pt format=onnx` and the Real-ESRGAN export need
# these; the produced .onnx files are shipped as the optional weights
# component. Install with: uv sync --extra onnx-export
# onnx is capped < 1.18: onnx >= 1.18 needs ml_dtypes >= 0.5 (float4_e2m1fn),
# but the [enhance] extra pins ml_dtypes 0.4.1 (via tb-nightly), and `import
# onnx` then crashes. 1.16/1.17 export YOLOv8 to ONNX fine with 0.4.1.
onnx-export = [
    "onnx>=1.16.0,<1.18.0",
    "onnxslim>=0.1.0",
]

# PyTorch detector + model-export/parity stack (M2 TASK 2.2). The DEFAULT
# (slim) install does NOT include this: object detection runs on ONNX Runtime
# (onnxruntime, a core dep). Install with `--extra torch` for the PyTorch
# object-detection backend, ONNX model export, the ONNX/torch parity test, or
# development against the torch path. ultralytics is AGPL-3.0 (fine for our
# AGPL app). torch/torchvision resolve to the CUDA 12.8 build via
# [tool.uv.sources]. Author: Bloodawn (KheivenD), 2026-06-03.
torch = [
    "ultralytics>=8.0.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]

# Super-resolution enhancement — only needed if using --enhance flag.
# Install with: uv sync --extra enhance
enhance = [
    "basicsr>=1.4.2",
    "realesrgan>=0.3.0",
]

# AI license-plate reader (post-process). FREE optional feature (v2 is
# open-source only; see README/CONTRIBUTING). The GUI auto-hides the plate
# button when no OCR backend is present, so a base install shows no empty
# controls.
#
# RECOMMENDED backend (R4 Phase 5, 2026-07-04): the ONNX ALPR stack
# fast-plate-ocr + open-image-models (both MIT, torch-free, run on the core
# onnxruntime). Unlike EasyOCR they install into the SAME environment as
# opencv-contrib-python, so the plate reader FINALLY ships in one env/exe.
# The catch: those packages declare opencv-python-headless as a REQUIRED dep,
# which would clobber the contrib cv2 - so they MUST be installed with
# --no-deps (the contrib cv2 already satisfies their runtime `import cv2`).
# A resolver `extra` cannot express --no-deps, so the ONNX reader is installed
# via a recipe/helper, NOT via `uv sync --extra plates`:
#
#     scripts/install_plates.ps1                 # Windows helper (recommended)
#   or, by hand (into the SAME env as core):
#     pip install --no-deps fast-plate-ocr open-image-models
#     pip install rich                           # only missing runtime dep
#
# Validated end-to-end in docs/PLATES-VALIDATION.md (contrib cv2 stays intact,
# real inference runs). Maintenance note: --no-deps is not resolver-enforced,
# so re-audit the cv2/numpy expectations on every upgrade (docs/BLOCKERS.md).
#
# LEGACY backends (still auto-detected if present, kept for existing installs):
# the [plates] extra below installs EasyOCR (Apache-2.0). EasyOCR depends on
# opencv-python-headless, which CLOBBERS opencv-contrib-python (MOG2 disappears)
# - so `uv sync --extra plates` must still go into a SEPARATE virtualenv. Prefer
# the ONNX recipe above, which does not have this problem. PaddleOCR (Apache-2.0)
# is likewise auto-detected if installed manually. OpenALPR (AGPL-3.0) is not
# used. Author: Bloodawn (KheivenD), 2026-05-14; ONNX default 2026-07-04.
plates = [
    "easyocr>=1.7.0",
]

# Opt-in crash reporting (Sentry). Disabled by default; the user has to
# both install this extra AND set SVCS_ENABLE_SENTRY=1 with a valid
# SENTRY_DSN env var before any traces are sent. The casual installer
# does NOT ship this; we add it for the premium / enterprise tier and
# for our own internal dogfood builds where we want backtraces from
# production crashes. PII (cookies, request headers, user IPs) is
# scrubbed; only the exception type, message, and Python traceback are
# transmitted.
# Install:  uv sync --extra crash-reporting
# Author: Bloodawn (KheivenD), 2026-05-14 (audit item: crash reporting).
crash-reporting = [
    "sentry-sdk>=2.0.0",
]

[project.scripts]
run-gui = "src.gui.run_gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# Use a project-local tmp dir for pytest fixtures. Windows %TEMP% periodically
# gets locked by AV/indexer/OneDrive, producing PermissionError on tmp_path
# fixtures (`pytest-of-<user>` directory). Keeping basetemp inside the repo
# under .pytest_tmp/ sidesteps all of that. The folder is gitignored.
# Author: Bloodawn (KheivenD), 2026-05-14.
addopts = "--basetemp=.pytest_tmp --tb=short -ra"

# ── PyTorch CUDA index ────────────────────────────────────────────────────────
# Tell uv to always fetch torch and torchvision from the CUDA 12.8 wheel index
# instead of PyPI. Without this, uv/pip installs the CPU-only build because
# that is what PyPI serves by default.
#
# To upgrade CUDA version: change both the index URL and the index name here,
# then run: uv pip install torch torchvision --reinstall
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
