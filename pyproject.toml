[project]
name = "Video-compression"
version = "0.1.0"
description = "Open-source selective video compression for static surveillance cameras"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Kheiven D'Haiti", email = "kdhaiti2024@fau.edu" },
    { name = "Jorge Sanchez", email = "jorgesanchez2022@fau.edu" },
    { name = "Ashleyn Montano", email = "amontano2023@fau.edu" },
    { name = "Riley Roberts", email = "robertsr2022@fau.edu" },
    { name = "Victor De Souza Teixeira", email = "vdesouzateix2023@fau.edu" },
]

dependencies = [
    # Core vision and video
    "opencv-python>=4.8.0,<4.11.0",
    "numpy>=1.24.0,<2.0.0",
    "Pillow>=10.0.0",
    # Video processing
    "ffmpeg-python>=0.2.0",
    # Pipeline utilities
    "tqdm>=4.65.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "Flask>=3.0.0",
    # Metrics and evaluation
    "scikit-image>=0.21.0",
    "scipy>=1.11.0",
    # Notebooks
    "jupyter>=1.0.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    # System metrics (CPU, RAM, battery monitoring)
    "psutil>=5.9.0",
    # Testing
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    # YOLO smart detection filter
    # YOLOv8-nano classifies MOG2 bounding boxes so leaves/shadows are not
    # recorded. Falls back to pass-through if this package is missing at runtime.
    # On first use, downloads yolov8n.pt (~6 MB) automatically.
    "ultralytics>=8.0.0",
    # PyTorch — pinned to CUDA 12.8 build via [tool.uv.sources] below.
    # CPU-only builds are pulled in by ultralytics/basicsr if torch is not
    # listed explicitly here, which breaks GPU detection and SR enhancement.
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    # AES-256-GCM segment encryption (the ENCRYPT tab in the dashboard).
    # Was previously imported lazily in src/utils/encryption.py without
    # being declared here, so a fresh `uv sync` left users without it
    # and the dashboard would fail with:
    #     "[!] Encryption failed: The 'cryptography' package is required"
    # Pinning >=41 because PBKDF2HMAC-from-bytes lives in the modern API.
    # Author: Bloodawn (KheivenD), 2026-05-03 (encrypt fix).
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
# Super-resolution enhancement — only needed if using --enhance flag
# Install with: uv sync --extra enhance
enhance = [
    "basicsr>=1.4.2",
    "realesrgan>=0.3.0",
]

# AI license-plate reader (post-process). Pulls a permissive-licensed OCR
# engine + lightweight image-processing deps. Both candidate engines are
# Apache-2.0; PaddleOCR has a dedicated plate-recognition model and is the
# primary backend, EasyOCR is the fallback when paddle wheels can't install.
# OpenALPR is intentionally NOT included — its AGPL-3.0 license would force
# the rest of the repo into AGPL.
# Install with: uv sync --extra plates
# Author: Bloodawn (KheivenD), 2026-05-02
plates = [
    "paddleocr>=2.7.0",
    "paddlepaddle>=2.6.0",
]
plates-fallback = [
    "easyocr>=1.7.0",
]

[project.scripts]
run-gui = "src.gui.run_gui:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# ── PyTorch CUDA index ────────────────────────────────────────────────────────
# Tell uv to always fetch torch and torchvision from the CUDA 12.8 wheel index
# instead of PyPI. Without this, uv/pip installs the CPU-only build because
# that is what PyPI serves by default.
#
# To upgrade CUDA version: change both the index URL and the index name here,
# then run: uv pip install torch torchvision --reinstall
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
